name: Validate charts

# Validation only — this workflow never builds or deploys anything. The
# site deploys from the gh-pages branch by a separate, unrelated process;
# nothing here touches that.
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # tools/validate-charts.mjs imports js/chart-parser.js etc. directly,
      # but rule 12 (BILINGUAL-SPEC.md §8) also pulls in tools/lib/pinyin.mjs,
      # which imports pinyin-pro — an npm package. The test suite spawns
      # tools/docx-to-chart.mjs too, which needs @xmldom/xmldom and jszip.
      # Install has to run before either step that needs these.
      - name: Install dependencies
        run: npm ci

      - name: Validate chord charts (BILINGUAL-SPEC.md §8)
        run: node tools/validate-charts.mjs

      - name: Run tests
        run: npm test
